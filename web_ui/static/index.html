<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>RenderCV 编辑器</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="app-shell" data-product="rendercv">
      <aside id="sidebar" class="sidebar" aria-label="简历导航"></aside>
      <section class="main-shell">
        <header id="top-toolbar" class="top-toolbar" aria-label="工作台工具栏"></header>
        <nav id="workspace-tabs" class="workspace-tabs" aria-label="工作区栏目" role="tablist"></nav>
        <main id="workspace" class="workspace">
          <section id="editor-panel" class="editor-panel" role="tabpanel" aria-live="polite"></section>
          <div id="splitter" class="splitter" role="separator" aria-label="调整编辑器和预览宽度" aria-orientation="vertical" tabindex="0"></div>
          <section id="preview-panel" class="preview-panel" aria-label="简历预览"></section>
        </main>
      </section>
    </div>
    <input id="yaml-file-input" type="file" accept=".yaml,.yml" hidden>
    <script src="/editor-model.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
